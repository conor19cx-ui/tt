server:
  port: 8080
  address: 0.0.0.0

app:
  upload-dir: ../static/uploads
  base-url: http://localhost:8080

spring:
  application:
    name: icampus-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/icampus?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      # 关闭下划线自动映射驼峰，因为我们已经手动处理
      # 自动映射会将 item_condition 映射为 condition，导致SQL中使用保留字
  mapper-locations: classpath*:/mapper/**/*.xml
